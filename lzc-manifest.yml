application:
  subdomain: infisical
  multi_instance: false
  upstreams:
    - location: /
      backend: http://backend:8080/
      fix_websocket_header: true
services:
  backend:
    # upstream: docker.io/infisical/infisical:v0.165.6
    image: docker.1ms.run/infisical/infisical:v0.165.6
    depends_on:
      - db
      - redis
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      - ENCRYPTION_KEY={{ stable_secret "encryption_key" | sha256sum | substr 0 32 }}
      - AUTH_SECRET={{ stable_secret "auth_secret" | substr 0 32 | b64enc }}
      - COOKIE_SECRET_SIGN_KEY={{ stable_secret "cookie_secret_sign_key" }}
      - DB_CONNECTION_URI=postgres://infisical:{{ stable_secret "postgres_password" }}@db:5432/infisical
      - REDIS_URL=redis://redis:6379
      - SITE_URL=https://{{ .S.AppDomain }}
      - TELEMETRY_ENABLED=false
      - OTEL_TELEMETRY_COLLECTION_ENABLED=false
      - DISABLE_UPDATE_CHECK=true
      - ANNOUNCEMENTS_ENABLED=false
  redis:
    # upstream: docker.io/library/redis:7.4.11-alpine
    image: docker.1ms.run/library/redis:7.4.11-alpine
    binds:
      - /lzcapp/var/infisical/redis:/data
  db:
    # upstream: docker.io/library/postgres:14-alpine
    image: docker.1ms.run/library/postgres:14-alpine
    environment:
      - POSTGRES_PASSWORD={{ stable_secret "postgres_password" }}
      - POSTGRES_USER=infisical
      - POSTGRES_DB=infisical
    binds:
      - /lzcapp/var/infisical/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=infisical && psql --username=infisical --list
      interval: 5s
      timeout: 10s
      retries: 10
usage: |
  Open Infisical and use its native registration and login flow. Database, Redis, encryption, authentication, and cookie-signing secrets are generated deterministically for this installation and persist across restarts. LazyCat OIDC, login autofill, and file-picker injection are intentionally not configured.
